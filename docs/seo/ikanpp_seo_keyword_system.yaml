    description_templates:
      - >
        在线观看《{title}》。查看{year}年{country}{genre}电影的剧情简介、
        演员表、导演及相关影片信息。
    h1:
      - "{title}"
    keywords_to_cover_in_body:
      - "{title}"
      - "{title} 在线观看"
      - "{title} 剧情"
      - "{title} 演员表"
      - "{title} 导演"

  tv_detail:
    title_templates:
      - "{title} 在线观看 | 最新全集 - iKanPP"
      - "{title}电视剧免费观看 | 剧情、演员表 - iKanPP"
    description_templates:
      - >
        在线观看《{title}》，查看最新更新、剧情简介、演员表、集数及相关电视剧推荐。
    h1:
      - "{title}"

  actor_detail:
    title_templates:
      - "{actor}电影电视剧作品大全 - iKanPP"
    description_templates:
      - >
        查看{actor}主演和参演的电影、电视剧作品，以及最新影视内容。

  genre_page:
    title_templates:
      - "{genre}电影大全 | 最新{genre}电影推荐 - iKanPP"
    description_templates:
      - >
        浏览最新和热门{genre}电影，按年份、地区、评分发现更多值得观看的影片。

  discovery_page:
    title_templates:
      - "{year}{country}{genre}电影推荐 - iKanPP"
    description_templates:
      - >
        查看{year}年热门{country}{genre}电影推荐，包括最新上映、
        热门作品和高关注度影片。

content_requirements:

  movie_detail:
    required:
      - "title"
      - "year"
      - "poster"
      - "description"
      - "genre"
      - "country"
    recommended:
      - "director"
      - "actors"
      - "runtime"
      - "release_date"
      - "rating"
      - "related_titles"

  tv_detail:
    required:
      - "title"
      - "poster"
      - "description"
      - "episode_count"
      - "status"
    recommended:
      - "actors"
      - "director"
      - "genre"
      - "country"
      - "year"
      - "related_titles"

internal_linking_rules:

  movie_detail:
    link_to:
      - "genre_page"
      - "country_page"
      - "year_page"
      - "actor_detail"
      - "director_detail"
      - "related_movies"

  tv_detail:
    link_to:
      - "genre_page"
      - "country_page"
      - "year_page"
      - "actor_detail"
      - "director_detail"
      - "episodes"
      - "related_tv"

  actor_detail:
    link_to:
      - "all_known_works"

  discovery_page:
    link_to:
      - "all_listed_entities"
      - "related_genres"
      - "related_years"
      - "related_countries"

canonical_rules:
  - "One searchable entity should have one primary canonical URL."
  - "Keyword variants must normally point to the same canonical entity page."
  - "Query parameters for sorting/filtering should not create competing canonical pages."
  - "Near-duplicate listing pages should canonicalize to the strongest parent page."
  - "Avoid indexing faceted combinations unless they have clear demand and unique value."

indexation_rules:

  index:
    - "movie detail with valid metadata"
    - "TV detail with valid metadata"
    - "actor page with enough works"
    - "director page with enough works"
    - "genre page with enough entities"
    - "country page with enough entities"
    - "year page with enough entities"
    - "high-value discovery page with unique content"

  noindex:
    - "empty search pages"
    - "internal search result pages"
    - "thin filter pages"
    - "duplicate tag pages"
    - "pages generated only by changing one modifier"
    - "zero-result pages"
    - "pages with no unique entity data"
    - "tracking parameter URLs"

programmatic_seo_guardrails:

  prohibited_patterns:
    - "Create one URL for every keyword variant"
    - "Create hundreds of near-identical pages differing only by title keyword"
    - "Generate empty actor or director pages"
    - "Generate pages with no meaningful entity data"
    - "Index all filter combinations automatically"

  preferred_patterns:
    - "Cluster related keywords by search intent"
    - "Map keyword clusters to one canonical page"
    - "Use entity data to create unique page value"
    - "Create discovery pages only when dataset is sufficiently rich"
    - "Use real site data and Search Console feedback"

keyword_clustering_logic:

  same_page_cluster_if:
    - "same primary entity"
    - "same dominant search intent"
    - "search result expectation is substantially identical"

  separate_page_if:
    - "different entity"
    - "different episode"
    - "different actor/director entity"
    - "discovery query requires a list rather than entity detail"
    - "search intent materially differs"

example_keyword_records:

  - keyword: "流浪地球3"
    root_keyword: "流浪地球3"
    entity_type: "movie"
    entity_name: "流浪地球3"
    intent: "navigation"
    keyword_type: "entity"
    target_url: "/movie/the-wandering-earth-3/"
    indexable: true
    priority: "A"

  - keyword: "流浪地球3 在线观看"
    root_keyword: "流浪地球3"
    entity_type: "movie"
    entity_name: "流浪地球3"
    modifier: "在线观看"
    intent: "watch"
    keyword_type: "long_tail"
    target_url: "/movie/the-wandering-earth-3/"
    indexable: true
    priority: "A"

  - keyword: "流浪地球3 演员表"
    root_keyword: "流浪地球3"
    entity_type: "movie"
    entity_name: "流浪地球3"
    modifier: "演员表"
    intent: "informational"
    keyword_type: "long_tail"
    target_url: "/movie/the-wandering-earth-3/"
    indexable: true
    priority: "B"

  - keyword: "2026 科幻电影推荐"
    root_keyword: "科幻电影"
    entity_type: "discovery"
    genre: "科幻"
    year: 2026
    intent: "discovery"
    keyword_type: "discovery"
    target_url: "/discover/2026/sci-fi/"
    indexable: true
    priority: "A"

automation_pipeline:

  step_1_ingest:
    input:
      - "movie API"
      - "TV API"
      - "manual data"
      - "existing CMS database"
    actions:
      - "normalize titles"
      - "normalize aliases"
      - "normalize genres"
      - "normalize country"
      - "normalize actor names"
      - "deduplicate entities"

  step_2_generate_keywords:
    actions:
      - "apply templates"
      - "generate keyword variants"
      - "assign intent"
      - "assign keyword type"
      - "assign entity ID"

  step_3_cluster:
    actions:
      - "group keywords by entity"
      - "group by intent"
      - "deduplicate semantically similar queries"
      - "choose canonical target URL"

  step_4_page_generation:
    actions:
      - "generate title"
      - "generate meta description"
      - "generate H1"
      - "generate intro text where appropriate"
      - "generate internal links"
      - "generate structured data"
      - "decide index/noindex"

  step_5_publish:
    actions:
      - "update sitemap"
      - "update internal links"
      - "submit changed URLs when supported"

  step_6_feedback:
    sources:
      - "Google Search Console"
      - "analytics"
      - "server logs"
    metrics:
      - "impressions"
      - "clicks"
      - "CTR"
      - "average position"
    actions:
      - "promote winning keywords"
      - "improve pages ranking positions 4-20"
      - "merge cannibalizing pages"
      - "remove or noindex low-value generated pages"
      - "discover new query modifiers"

gsc_optimization_rules:

  opportunity:
    condition:
      impressions_min: 100
      position_min: 4
      position_max: 20
    action:
      - "increase content relevance"
      - "improve title"
      - "improve internal links"
      - "add missing semantic entities"

  low_ctr:
    condition:
      impressions_min: 300
      ctr_below_percent: 2.0
    action:
      - "rewrite title"
      - "rewrite meta description"
      - "check SERP intent mismatch"

  cannibalization:
    condition:
      multiple_urls_same_query: true
    action:
      - "choose strongest canonical page"
      - "merge content if appropriate"
      - "redirect weaker page when appropriate"
      - "adjust internal links"

ai_agent_instructions:
  - "Do not create a new URL only because a new keyword exists."
  - "First identify the entity and intent."
  - "Cluster semantically equivalent keywords."
  - "Prefer one authoritative page per entity."
  - "Use keyword variants naturally in metadata and content."
  - "Only create indexable discovery pages when they provide unique list value."
  - "Never mass-index empty or near-duplicate pages."
  - "When uncertain, default to noindex rather than creating thin indexable pages."
  - "Use Search Console data to update priorities instead of relying only on generated keywords."

