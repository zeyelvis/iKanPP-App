name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
    paths:
      - 'app/**'
      - 'components/**'
      - 'lib/**'
      - 'public/**'
      - 'package.json'
      - 'package-lock.json'
      - 'next.config.*'
      - 'postcss.config.*'
      - 'tsconfig.json'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    name: Build and Deploy to Cloudflare Pages
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run Architecture Contract & Zero-404 Integrity Gate
        run: |
          node scripts/test-architecture-integrity.mjs
          npx tsx scripts/test-latest-titles-404.mjs

      - name: Build Next.js application for Cloudflare Pages
        run: npm run pages:build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .vercel/output/static --project-name=ikanpp --branch=main


      - name: Auto-submit URLs to Search Engines (IndexNow)
        run: |
          echo "🚀 触发全自动搜索引擎即时收录广播 (IndexNow)..."
          node scripts/push-indexnow.mjs || true


