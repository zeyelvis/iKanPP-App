name: Auto Sync IYF Channels & Drama Hero Slides

on:
  schedule:
    # 全站每小时整点全自动巡检同步（电视剧、新番等快节奏连载实施小时级极速感知）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: '选择需要同步的爱壹帆专区板块'
        required: true
        default: 'all_channels'
        type: choice
        options:
          - 'all_channels'
          - 'tv'
          - 'movie'
          - 'anime'
          - 'variety'
          - 'documentary'
          - 'home'

# 赋予工作流代码提交、推送与调度权限
permissions:
  contents: write
  actions: write

jobs:
  sync-iyf-hero:
    name: Sync IYF Hero & Trending Nav
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute IYF Channels & Latest Titles Sync
        run: |
          TARGET="${{ github.event.inputs.channel || 'all_channels' }}"
          echo "🚀 正在启动爱壹帆专区轮播与速报同步，目标板块: $TARGET"
          node scripts/sync-iyf-hero.mjs --target="$TARGET"
          echo "🚀 正在启动全站 6 大专区「最新上线」真实增量流巡检与预烘焙..."
          node scripts/sync-latest-titles.mjs

      - name: Commit, push, and trigger deploy if data updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          if [[ -n $(git status --porcelain lib/data/home-prebaked.ts lib/data/home-prebaked-extra.ts lib/data/latest-titles-prebaked.ts) ]]; then
            TARGET="${{ github.event.inputs.channel || 'all_channels' }}"
            echo "✅ 检测到预烘焙影视大剧、速报与最新上线数据更新，正在提交..."
            git add lib/data/home-prebaked.ts lib/data/home-prebaked-extra.ts lib/data/latest-titles-prebaked.ts
            git commit -m "chore(sync): 自动同步全站专区 [$TARGET] 轮播、速报与最新上线影视"
            git push
            echo "🚀 正在触发 Cloudflare Pages 编译部署工作流..."
            gh workflow run deploy.yml --ref main
            echo "🎉 数据已推送到远程仓库并成功触发自动部署！"
          else
            echo "✨ 现有影视数据已是最新，无变动。"
          fi
