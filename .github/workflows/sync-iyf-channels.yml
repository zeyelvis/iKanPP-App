name: Auto Sync IYF Channels & Drama Hero Slides

on:
  schedule:
    # 全站每小时整点全自动巡检同步（电视剧、新番等快节奏连载实施小时级极速感知）
    - cron: '0 * * * *'
  workflow_dispatch:
    inputs:
      channel:
        description: '选择需要同步的爱壹帆专区板块'
        required: true
        default: 'all_channels'
        type: choice
        options:
          - 'all_channels'
          - 'tv'
          - 'movie'
          - 'anime'
          - 'variety'
          - 'documentary'
          - 'home'

# 赋予工作流代码提交、推送与调度权限
permissions:
  contents: write
  actions: write

jobs:
  sync-iyf-hero:
    name: Sync IYF Hero & Trending Nav
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Execute Full Auto-Update & SEO Pipeline
        env:
          CF_KV_ACCOUNT_ID: ${{ secrets.CF_KV_ACCOUNT_ID || '172a13185bd6e694bfefc089b12cad6a' }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID || '42311924427747deaf00981d99d58998' }}
          CF_KV_API_KEY: ${{ secrets.CF_KV_API_KEY || 'cfk_L8MzQDjTswTK4jBtvJjmcKjEnxTQ1dKNhzNyn4dQa33221aa' }}
          CF_KV_EMAIL: ${{ secrets.CF_KV_EMAIL || 'zeyelvis@gmail.com' }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY || '82eaf0e14803590730e45c2123c90957' }}
        run: |
          TARGET="${{ github.event.inputs.channel || 'all_channels' }}"
          echo "🚀 [1/6] 爱壹帆专区轮播与速报同步，目标板块: $TARGET..."
          node scripts/sync-iyf-hero.mjs --target="$TARGET"

          echo "🚀 [2/6] 全球数字发行雷达：爱壹帆 + 采集站 + TMDB 智能融合增量流巡检..."
          node scripts/sync-release-radar.mjs

          echo "📺 [3/6] 连载作品最新集数变更自动检测与角标回写..."
          node scripts/sync-episode-updates.mjs

          echo "⚡ [4/6] 巨量资源短剧专线全自动化巡检与预烘焙同步..."
          node scripts/sync-juliang-short-dramas.mjs

          echo "📚 [5/6] 全站 7 大专区预烘焙分类数据全量刷新..."
          node scripts/sync-category-prebaked.mjs

          echo "🔍 [6/6] SEO Entity 自动入库与全网搜索引擎推送..."
          node scripts/sync-seo-entities.mjs

      - name: Commit, push, and trigger deploy if data updated
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          MODIFIED_FILES="lib/data/home-prebaked.ts lib/data/home-prebaked-extra.ts lib/data/latest-titles-prebaked.ts lib/data/category-prebaked.ts lib/data/new-scraped-titles.json"

          if [[ -n $(git status --porcelain $MODIFIED_FILES) ]]; then
            TARGET="${{ github.event.inputs.channel || 'all_channels' }}"
            echo "✅ 检测到预烘焙影视、最新集数与分类大厅数据更新，正在提交..."
            git add $MODIFIED_FILES
            git commit -m "chore(sync): 自动同步全站专区 [$TARGET] 轮播、集数更新、分类大厅与 SEO 实体"
            git push
            echo "🚀 正在触发 Cloudflare Pages 编译部署工作流..."
            gh workflow run deploy.yml --ref main
            echo "⚡ 正在自动联动全站全维度全量预热工作流..."
            gh workflow run full-site-prewarm.yml --ref main
            echo "🎉 数据已推送到远程仓库并成功触发自动部署与全量预热！"
          else
            echo "✨ 现有影视数据已是最新，无变动。"
          fi
