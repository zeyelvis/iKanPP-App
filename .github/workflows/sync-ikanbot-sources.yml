name: Daily Sync Sources & Hero Slides

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 自动执行同步
    - cron: '0 3 * * *'
  workflow_dispatch:

# 赋予工作流代码提交与写入权限
permissions:
  contents: write

jobs:
  sync-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run ikanbot Sources Sync
        run: |
          node scripts/sync-ikanbot-sources.mjs

      - name: Run iyf.tv Hero Slides Sync
        run: |
          node scripts/sync-iyf-hero.mjs

      - name: Commit and push if data changed
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          
          if [[ -n $(git status --porcelain lib/api/default-sources.ts lib/data/home-prebaked.ts) ]]; then
            echo "Detected updated sources or hero slides. Committing changes..."
            git add lib/api/default-sources.ts lib/data/home-prebaked.ts
            git commit -m "chore(sync): daily auto-sync sources and iyf.tv hero slides [skip ci]"
            git push
          else
            echo "No changes in sources or hero slides. Everything is up to date."
          fi
