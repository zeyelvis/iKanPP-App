name: Full-Site Auto Prewarm & CDN Edge Ingestion

on:
  schedule:
    # 每天 2 次全站全量预热巡检（低峰期稳定预热，杜绝每次无脑联动耗尽配额）：
    # 1. UTC 20:00 (北京时间凌晨 04:00，夜间全网低峰全量预热)
    # 2. UTC 08:30 (北京时间下午 16:30，午后档新片更新后预热)
    - cron: '0 20 * * *'
    - cron: '30 8 * * *'

  # 支持在 GitHub Actions 页面随时手动一键点击触发
  workflow_dispatch:
    inputs:
      reason:
        description: '触发全量预热的原因'
        required: false
        default: 'Manual trigger full-site prewarm'

permissions:
  contents: write
  actions: write

jobs:
  full-prewarm:
    name: Execute Full-Site Multi-Dimensional Prewarm
    runs-on: [self-hosted, linux]
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run Full-Site Prewarm Engine
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUTH_EMAIL: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}
          CLOUDFLARE_AUTH_KEY: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CF_KV_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          SITE_URL: 'https://www.ikanpp.com'
        run: |
          echo "🚀 启动 iKanPP 全站全维度全量自动化预热..."
          npx tsx scripts/full-site-prewarm.ts

      - name: Run Full-Site Cast & Metadata Batch Healer
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_AUTH_EMAIL: ${{ secrets.CLOUDFLARE_AUTH_EMAIL }}
          CLOUDFLARE_AUTH_KEY: ${{ secrets.CLOUDFLARE_AUTH_KEY }}
          CF_KV_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CF_KV_NAMESPACE_ID: ${{ secrets.CF_KV_NAMESPACE_ID }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: |
          echo "🩺 启动全站演职员与核心元数据全量批量自愈..."
          npx tsx scripts/seo/full-site-cast-healer.mjs

      - name: Commit and push updates if any
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

          git add lib/data/prebaked-avatars.ts scripts/seo/.healer-checkpoint.json 2>/dev/null || true
          if [[ -n $(git status --porcelain) ]]; then
            echo "✅ 检测到演职员自愈与肖像库更新，正在提交入库..."
            git commit -m "chore(healer): 增量持久化演职员肖像与全库自愈断点进度"
            git push
            echo "🚀 正在触发生产环境重新部署..."
            gh workflow run deploy.yml --ref main
            echo "🎉 资产与自愈数据已更新至生产环境！"
          else
            echo "✨ 当前无新增改动，保持最新状态。"
          fi
