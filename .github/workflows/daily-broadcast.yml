name: Daily Telegram Movie Broadcast

on:
  schedule:
    # 每天 UTC 01:00 (北京时间早 09:00) 自动执行
    - cron: '0 1 * * *'
    # 每天 UTC 12:00 (北京时间晚 20:00 黄金时段) 自动执行
    - cron: '0 12 * * *'
  workflow_dispatch:

jobs:
  broadcast:
    runs-on: [self-hosted, linux]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Telegram Daily Broadcast
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          node scripts/daily-telegram-broadcast.mjs
