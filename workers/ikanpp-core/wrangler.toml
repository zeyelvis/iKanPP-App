# ==============================================================================
# iKanPP Core Worker (Cloudflare Native Edge Streaming & Resolve Engine)
# ==============================================================================

name = "ikanpp-core-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 生产环境已绑定的原生 KVIDEO_KV 命名空间
[[kv_namespaces]]
binding = "KVIDEO_KV"
id = "42311924427747deaf00981d99d58998"

[vars]
ENVIRONMENT = "production"
VERSION = "1.0.0"

# 2026-10-08：只保留专线解析接口（看片片、夜貓追劇的 /api/lines 实时调用 www.ikanpp.com/api/shadowline/resolve，
# 由主站 next.config.ts 转发到这里）。原每小时「边缘入库」定时任务什么也不写，已去掉。
[triggers]
crons = []

