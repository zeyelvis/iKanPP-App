# ==============================================================================
# iKanPP Core Worker (Cloudflare Native Edge Streaming & Resolve Engine)
# ==============================================================================

name = "ikanpp-core-worker"
main = "src/index.ts"
compatibility_date = "2026-09-01"
compatibility_flags = ["nodejs_compat"]

# 生产环境已绑定的原生 KVIDEO_KV 命名空间
[[kv_namespaces]]
binding = "KVIDEO_KV"
id = "42311924427747deaf00981d99d58998"

[vars]
ENVIRONMENT = "production"
VERSION = "1.0.0"

# 边缘每小时定时入库巡检 Cron (任务 3.4)
[triggers]
crons = ["0 * * * *"]

